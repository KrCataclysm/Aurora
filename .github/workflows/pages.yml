name: pages

on:
  push:
    branches: [main]
    paths: ["crypto-lab/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        working-directory: crypto-lab
        run: |
          test -f index.html
          test -f payload.enc.json
          grep -q "<!-- og:start -->" index.html
          grep -q "<!-- og:end -->" index.html
          node -e "const p=require('./payload.enc.json');if(p.v!==1||!p.ct)process.exit(1)"

      - name: Assemble site
        run: |
          mkdir _site
          cp -r crypto-lab/index.html crypto-lab/css crypto-lab/js crypto-lab/payload.enc.json _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
